name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
  pull_request:
    branches: [main]
    paths:
      - '**.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          echo "Running shellcheck on all .sh files..."
          find . -name '*.sh' -type f -print0 | xargs -0 shellcheck -x -e SC1090 -e SC1091 -e SC2155 -e SC2034 -e SC2086
          echo "shellcheck passed!"

      - name: Summary
        if: always()
        run: |
          echo "## ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "All shell scripts checked." >> $GITHUB_STEP_SUMMARY
